app = "astro-chart-api"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  ASTRO_DB_PATH = "/data/astro.db"
  API_KEY_MODE = "open"

# Persistent SQLite store (API keys + usage). Single machine + single volume;
# scale-to-zero keeps data across restarts. ADMIN_TOKEN is a Fly secret.
[mounts]
  source = "astro_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
